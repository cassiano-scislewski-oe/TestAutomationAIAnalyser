name: Test Automation AI Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qa-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run AI Analyzer
        run: node ai-analyzer/ai.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Complete job
        run: echo "Analysis complete"
